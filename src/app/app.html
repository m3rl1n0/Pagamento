<div class="container">
  <div class="header">
    <h1>Scegli il tuo metodo di pagamento</h1>
    <p>Seleziona il servizio che preferisci utilizzare</p>
  </div>

  <div class="cards-grid">
    @for (service of paymentServices(); track service.id) {
      <kendo-card class="payment-card" [width]="'100%'">
        <kendo-card-body>
          <div class="logo-container">
            <img [src]="service.logo" [alt]="service.name">
          </div>
          <h2 class="service-name">{{ service.name }}</h2>

          @if (service.isIban) {
            <button kendoButton
                    (click)="copyIBAN()"
                    themeColor="primary"
                    size="large"
                    [class]="'payment-button ' + service.colorClass">
              {{ service.buttonText }}
            </button>
          } @else {
            <a [href]="service.link"
               target="_blank"
               kendoButton
               [class]="'payment-button ' + service.colorClass">
              {{ service.buttonText }}
            </a>
          }
        </kendo-card-body>
      </kendo-card>
    }
  </div>
</div>

@if (showNotification()) {
  <div class="copy-notification show">
    ✓ IBAN copiato negli appunti!
  </div>
}
