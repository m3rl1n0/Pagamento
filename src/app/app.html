<div class="container">
  <div class="header">
    <h1>Scegli il tuo metodo di pagamento</h1>
    <p>Seleziona il servizio che preferisci utilizzare</p>
  </div>

  <div class="cards-grid">
    @for (service of paymentServices(); track service.id) {
      <div class="payment-card">
        <div class="logo-container">
          <img [src]="service.logo" [alt]="service.name">
        </div>
        <h2 class="service-name">{{ service.name }}</h2>

        @if (service.isIban) {
          <button (click)="copyIBAN()" [class]="'payment-button ' + service.colorClass">
            {{ service.buttonText }}
          </button>
        } @else {
          <a [href]="service.link"
             target="_blank"
             [class]="'payment-button ' + service.colorClass">
            {{ service.buttonText }}
          </a>
        }
      </div>
    }
  </div>
</div>

@if (showNotification()) {
  <div class="copy-notification show">
    ✓ IBAN copiato negli appunti!
  </div>
}
